document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bsolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px dashed rgba(27,21,16,.35);background:#F4EFE4\">\n              <img src=\"8ef17b8f-d2a6-4248-b02e-1db1b32e45eb\" alt=\"\" style=\"width:46%;height:auto;opacity:.85\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#514C45\">WINTER 2026<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n          <span style=\"font-size:21px;font-weight:700;letter-spacing:-.01em\">{{ p.title }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#514C45\">{{ p.priceLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ p.hasVariants }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ p.variants }}\" as=\"v\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ v.pick }}\" disabled=\"{{ v.soldOut }}\" style=\"min-width:48px;height:48px;padding:0 12px;background:{{ v.bg }};color:{{ v.fg }};border:1px solid #1B1510;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em\">{{ v.title }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ p.showNotifyBtn }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ p.openNotify }}\" style=\"height:52px;background:#1B1510;color:#F4EFE4;border:0;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">NOTIFY ME<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ p.notified }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:2px solid #1B1510;background:#FFFFFF;padding:14px 16px;font-size:15px;line-height:1.5\">You're on the list. We'll email you on drop day.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ p.showAdd }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ p.add }}\" disabled=\"{{ busy }}\" style=\"height:52px;background:#1B1510;color:#F4EFE4;border:0;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">{{ p.addLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ p.isGum }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"mobile.html#join\" style=\"box-sizing:border-box;height:52px;border:2px solid #1B1510;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">JOIN THE WAITLIST<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-screen-label=\"Footer\" style=\"background:#1B1510;color:#F4EFE4;padding:52px 26px 36px;display:flex;flex-direction:column;gap:36px\">\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <img src=\"aeaf7385-cbdc-410b-b3f5-c8071201b4c5\" alt=\"Lucid\" style=\"height:26px;width:auto;align-self:flex-start\">\n    <span style=\"font-size:14px;color:#B5AFA6\">Lucid Inc., New York<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 20px;font-size:15px\">\n    <div style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#B5AFA6\">CONTACT<\u002Fspan><a href=\"mailto:company@lucidgum.co\" style=\"color:#F4EFE4\">company@lucidgum.co<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#B5AFA6\">FOLLOW<\u002Fspan><a href=\"https://www.instagram.com/takelucid/\" target=\"_blank\" rel=\"noopener\" style=\"color:#F4EFE4\">Instagram ↗<\u002Fa><a href=\"https://www.tiktok.com/@takelucid\" target=\"_blank\" rel=\"noopener\" style=\"color:#F4EFE4\">TikTok ↗<\u002Fa><a href=\"https://www.linkedin.com/company/lucid-gum\" target=\"_blank\" rel=\"noopener\" style=\"color:#F4EFE4\">LinkedIn ↗<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#B5AFA6\">SITE<\u002Fspan><a href=\"science-mobile.html\" style=\"color:#F4EFE4\">Science<\u002Fa><a href=\"mobile.html#faq\" style=\"color:#F4EFE4\">FAQ<\u002Fa><a href=\"#top\" sc-camel-on-click=\"{{ goTop }}\" style=\"color:#F4EFE4\">Shop<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:11px;line-height:1.75;color:#B5AFA6\">Contains caffeine. Not recommended for anyone under 18, anyone pregnant or nursing, or anyone sensitive to caffeine. These statements have not been evaluated by the Food and Drug Administration. This product is not intended to diagnose, treat, cure, or prevent any disease.<br>© 2026 Lucid Inc.<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<div sc-camel-on-click=\"{{ closeSheets }}\" style=\"position:absolute;inset:0;z-index:60;background:rgba(27,21,16,.45);opacity:{{ dim.op }};visibility:{{ dim.vis }};transition:opacity .25s,visibility .25s\"><\u002Fdiv>\n\n<div role=\"dialog\" aria-label=\"{{ sheetTitle }}\" style=\"position:absolute;left:0;right:0;bottom:0;z-index:61;background:#F4EFE4;border-top:2px solid #1B1510;padding:20px 26px 30px;display:flex;flex-direction:column;gap:14px;transform:{{ sheet.tf }};visibility:{{ sheet.vis }};transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n    <span style=\"font-size:22px;font-weight:700;letter-spacing:-.01em\">{{ sheetTitle }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ closeSheets }}\" aria-label=\"Close\" style=\"width:44px;height:44px;margin-right:-10px;background:none;border:0;font-size:24px;color:#1B1510\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <form sc-camel-on-submit=\"{{ submitNotify }}\" style=\"display:flex;flex-direction:column;gap:10px\">\n    <input id=\"notifyEmail\" type=\"email\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@email.com\" aria-label=\"Email address\" style=\"box-sizing:border-box;width:100%;height:54px;background:#FFFFFF;border:2px solid #1B1510;border-radius:0;color:#1B1510;padding:0 16px;font-family:'IBM Plex Mono',monospace;font-size:16px;outline:none\" style-focus=\"border-color:#C52A1E\">\n    <button type=\"submit\" style=\"height:54px;background:#1B1510;color:#F4EFE4;border:0;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">{{ notifyLabel }}<\u002Fbutton>\n    <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:14px;color:#C52A1E\">{{ errorMsg }}<\u002Fspan><\u002Fsc-if>\n  <\u002Fform>\n<\u002Fdiv>\n\n<aside aria-label=\"Cart\" style=\"position:absolute;inset:0;z-index:62;background:#F4EFE4;display:flex;flex-direction:column;transform:{{ cartPanel.tf }};visibility:{{ cartPanel.vis }};transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s\">\n  <div style=\"height:56px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:0 8px 0 20px;border-bottom:1px solid rgba(27,21,16,.2)\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em\">CART ({{ cartCount }})<\u002Fspan>\n    <button sc-camel-on-click=\"{{ closeSheets }}\" aria-label=\"Close cart\" style=\"background:none;border:0;font-size:24px;color:#1B1510;width:44px;height:44px\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow:auto;padding:4px 20px\">\n    <sc-if value=\"{{ cartEmpty }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:16px;color:#514C45\">Your cart is empty.<\u002Fp><\u002Fsc-if>\n    <sc-for list=\"{{ cartLines }}\" as=\"l\" hint-placeholder-count=\"0\">\n      <div style=\"display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid rgba(27,21,16,.22)\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-weight:600\">{{ l.title }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#514C45\">{{ l.variant }} · QTY {{ l.qty }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\"><span>{{ l.price }}<\u002Fspan><button sc-camel-on-click=\"{{ l.remove }}\" style=\"background:none;border:0;padding:10px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#514C45\">REMOVE<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"padding:18px 20px 24px;border-top:2px solid #1B1510;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;justify-content:space-between;font-size:18px;font-weight:700\"><span>Subtotal<\u002Fspan><span>{{ subtotal }}<\u002Fspan><\u002Fdiv>\n    <a href=\"{{ checkoutUrl }}\" style=\"background:#1B1510;color:#F4EFE4;height:54px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">CHECKOUT<\u002Fa>\n    <span style=\"font-size:13px;color:#514C45\">Shipping and taxes calculated at checkout.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Faside>\n\n<nav aria-label=\"Menu\" style=\"position:absolute;left:0;right:0;top:56px;bottom:0;z-index:40;background:#F4EFE4;padding:12px 26px 28px;display:flex;flex-direction:column;opacity:{{ menu.op }};transform:{{ menu.tf }};visibility:{{ menu.vis }};transition:opacity .22s,transform .22s,visibility .22s\">\n  <a href=\"mobile.html#gum\" style=\"padding:16px 0;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em\">GUM<\u002Fa>\n  <a href=\"science-mobile.html\" style=\"padding:16px 0;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em\">SCIENCE<\u002Fa>\n  <a href=\"mobile.html#faq\" style=\"padding:16px 0;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em\">FAQ<\u002Fa>\n  <a href=\"#top\" sc-camel-on-click=\"{{ goTop }}\" style=\"padding:16px 0;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;color:#C52A1E\">SHOP<span style=\"width:10px;height:10px;border-radius:50%;background:#C52A1E\"><\u002Fspan><\u002Fa>\n  <sc-if value=\"{{ notLive }}\" hint-placeholder-val=\"{{ true }}\">\n    <a href=\"mobile.html#join\" style=\"margin-top:auto;background:#1B1510;color:#F4EFE4;height:54px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em\">JOIN THE WAITLIST<\u002Fa>\n  <\u002Fsc-if>\n<\u002Fnav>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;liveMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Shopify&quot;},&quot;shopDomain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Shopify&quot;},&quot;storefrontToken&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Shopify&quot;}}\">\nclass Component extends DCLogic {\n  state = { email: '', error: false, sending: false, notifyFor: null, notified: {}, picked: {}, merchHover: null, remote: {}, cart: null, cartOpen: false, busy: false, menuOpen: false };\n  _sc() { return document.getElementById('screen'); }\n  _frame() {\n    const W = window.innerWidth, H = window.innerHeight;\n    if (!W || !H) return { boxW: '390px', boxH: '844px', w: '390px', h: '844px', tf: 'none', sh: 'none' };\n    if (W < 560) return { boxW: W + 'px', boxH: H + 'px', w: W + 'px', h: H + 'px', tf: 'none', sh: 'none' };\n    const s = Math.min(1, (H - 48) / 844, (W - 48) / 390);\n    return { boxW: 390 * s + 'px', boxH: 844 * s + 'px', w: '390px', h: '844px', tf: 'scale(' + s + ')', sh: '0 30px 70px rgba(27,21,16,.22)' };\n  }\n  async _saveToWaitlist(email, product) {\n    const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqY3Jib2Nvc3pveXNyeGJwdXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMjc0NzIsImV4cCI6MjA5NjkwMzQ3Mn0.IvSL5gN7X2L0mOm_OT3so7eVMP1PyfmC7WQwaI8i6DY';\n    const res = await fetch('https://jjcrbocoszoysrxbpupr.supabase.co/rest/v1/merch_notify', {\n      method: 'POST',\n      headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },\n      body: JSON.stringify({ email, product })\n    });\n    if (!res.ok && res.status !== 409) throw new Error('waitlist ' + res.status);\n  }\n  async _gql(query, variables) {\n    const S = this._cfg();\n    const res = await fetch(`https://${S.domain}/api/${S.apiVersion}/graphql.json`, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': S.storefrontToken },\n      body: JSON.stringify({ query, variables })\n    });\n    const j = await res.json();\n    if (j.errors) throw new Error(j.errors[0].message);\n    return j.data;\n  }\n  _cfg() {\n    return {\n      domain: this.props.shopDomain || '',\n      storefrontToken: this.props.storefrontToken || '',\n      apiVersion: '2025-01',\n      live: !!(this.props.liveMode && this.props.shopDomain && this.props.storefrontToken),\n      handles: { tee: 'lucid-tee', tote: 'lucid-tote' }\n    };\n  }\n  componentDidMount() {\n    let tries = 0;\n    const wait = () => { const sc = this._sc(); if (sc && sc.clientHeight > 0) { this._init(); return; } if (++tries < 600) this._waitRaf = requestAnimationFrame(wait); };\n    wait();\n  }\n  async _init() {\n    this._onResize = () => this.forceUpdate();\n    window.addEventListener('resize', this._onResize);\n    try { this.setState({ notified: JSON.parse(localStorage.getItem('lucid_notify') || '{}') }); } catch (e) {}\n    const motion = (this.props.motion ?? true) && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (motion) {\n      const ease = 'cubic-bezier(.2,.8,.2,1)';\n      const fadeUp = (el, d) => el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 280, delay: d || 0, easing: ease, fill: 'backwards' });\n      const intro = document.getElementById('top');\n      if (intro) Array.from(intro.children).forEach((el, i) => fadeUp(el, i * 45));\n      this._io = new IntersectionObserver((es) => es.forEach(e => {\n        const t = e.target;\n        if (e.intersectionRatio === 0) { t._out = true; return; }\n        if (!e.isIntersecting || e.intersectionRatio < 0.12 || t._out === false) return;\n        t._out = false;\n        fadeUp(t);\n      }), { root: this._sc(), threshold: [0, 0.12] });\n      const list = document.getElementById('products');\n      if (list) Array.from(list.children).forEach(el => this._io.observe(el));\n    }\n    const S = this._cfg();\n    if (!S.live) return;\n    const P = 'title availableForSale priceRange { minVariantPrice { amount currencyCode } } variants(first: 20) { nodes { id title availableForSale price { amount currencyCode } } }';\n    try {\n      const d = await this._gql(`{ tee: product(handle: \"${S.handles.tee}\") { ${P} } tote: product(handle: \"${S.handles.tote}\") { ${P} } }`);\n      this.setState({ remote: d });\n      const id = localStorage.getItem('lucid_cart_id');\n      if (id) this._setCart((await this._gql(`query($id: ID!) { cart(id: $id) { ${this._cartFields()} } }`, { id })).cart);\n    } catch (e) { console.warn('Shopify', e); }\n  }\n  componentWillUnmount() { if (this._waitRaf) cancelAnimationFrame(this._waitRaf); window.removeEventListener('resize', this._onResize); if (this._io) this._io.disconnect(); }\n  _cartFields() { return 'id checkoutUrl totalQuantity cost { subtotalAmount { amount currencyCode } } lines(first: 50) { nodes { id quantity merchandise { ... on ProductVariant { title product { title } price { amount currencyCode } } } } }'; }\n  _setCart(cart) { this.setState({ cart }); try { cart ? localStorage.setItem('lucid_cart_id', cart.id) : localStorage.removeItem('lucid_cart_id'); } catch (e) {} }\n  async _add(variantId) {\n    this.setState({ busy: true });\n    try {\n      const lines = [{ merchandiseId: variantId, quantity: 1 }];\n      const F = this._cartFields();\n      const d = this.state.cart\n        ? (await this._gql(`mutation($id: ID!, $lines: [CartLineInput!]!) { cartLinesAdd(cartId: $id, lines: $lines) { cart { ${F} } } }`, { id: this.state.cart.id, lines })).cartLinesAdd\n        : (await this._gql(`mutation($lines: [CartLineInput!]!) { cartCreate(input: { lines: $lines }) { cart { ${F} } } }`, { lines })).cartCreate;\n      this._setCart(d.cart);\n      this.setState({ cartOpen: true });\n    } catch (e) { console.warn('Shopify', e); }\n    this.setState({ busy: false });\n  }\n  async _remove(lineId) {\n    const d = await this._gql(`mutation($id: ID!, $ids: [ID!]!) { cartLinesRemove(cartId: $id, lineIds: $ids) { cart { ${this._cartFields()} } } }`, { id: this.state.cart.id, ids: [lineId] });\n    this._setCart(d.cartLinesRemove.cart);\n  }\n  renderVals() {\n    const S = this._cfg();\n    const money = (m) => m ? new Intl.NumberFormat('en-US', { style: 'currency', currency: m.currencyCode }).format(+m.amount) : '';\n    const base = [\n      { key: 'tee', title: 'Lucid Tee', slotId: 'merch-tee', slotLabel: 'T-shirt product shot', imgs: ['assets/merch/tee-front-v2.jpg', 'assets/merch/tee-back-v2.jpg', 'Lucid Tee, front', 'Lucid Te
